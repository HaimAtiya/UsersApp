<mat-card class="edit-card">
  <mat-card-title>Edit User</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="edit-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
        <mat-error *ngIf="email.touched && email.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="email.touched && email.hasError('email')">
          Invalid email format
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" />
        <mat-error *ngIf="username.touched && username.hasError('required')">
          Username is required
        </mat-error>
        <mat-error *ngIf="username.touched && username.hasError('minlength')">
          Min length 3
        </mat-error>
        <mat-error *ngIf="username.touched && username.hasError('maxlength')">
          Max length 20
        </mat-error>
        <mat-error *ngIf="username.touched && username.hasError('pattern')">
          Only Latin letters, digits, _
        </mat-error>
        <mat-error *ngIf="username.touched && username.hasError('adminForbidden')">
          Username cannot be "admin"
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Age</mat-label>
        <input matInput type="number" formControlName="age" />
        <mat-error
          *ngIf="age.touched && (age.hasError('required') || age.hasError('min') || age.hasError('max'))"
        >
          Age must be between 18 and 100
        </mat-error>
      </mat-form-field>

      <div class="actions">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || form.pristine"
        >
          Save
        </button>
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
